<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Viewport meta tag: tells mobile browsers to use the device's actual width
         instead of a zoomed-out desktop view. Essential for responsive design. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO meta tags -->
    <meta name="description" content="Apoorva Verma — Portfolio website showcasing projects, experience, and skills." />
    <meta name="author" content="Apoorva Verma" />
    <title>Apoorva Verma | Portfolio</title>

    <!-- Google Fonts: Andika
         - preconnect tells the browser to establish a connection to Google's font servers
           early, so the font loads faster when it's actually needed.
         - We load 4 variants: regular (400), bold (700), italic (400i), bold-italic (700i) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- This div is where React mounts the entire application.
         React's main.tsx renders <App /> into this element. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
